<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Complete - Beneath The Mask</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --window-bg: #0d0d0d;
            --text-color: #00ff41;
            --text-dim: #00aa2a;
            --accent: #00ff41;
            --border-color: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Fira Code', 'Share Tech Mono', monospace; background-color: #000; color: var(--text-color); }
        #desktop-screen { background: url('/static/img/wallpaper.jpg') no-repeat center center/cover; width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        #desktop-screen::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); pointer-events: none; z-index: 1000; }
        #desktop { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 1; }
        .icon { width: 80px; text-align: center; cursor: pointer; padding: 10px; border-radius: 4px; transition: all 0.2s; }
        .icon:hover { background: rgba(0,255,65,0.1); box-shadow: 0 0 10px rgba(0,255,65,0.2); }
        .icon-img { width: 48px; height: 48px; background: rgba(0,255,65,0.1); border: 1px solid var(--accent); border-radius: 8px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); }
        .icon-label { font-size: 11px; color: var(--text-color); text-shadow: 0 0 10px rgba(0,255,65,0.5), 1px 1px 2px black; user-select: none; }
        .window { position: absolute; background: var(--window-bg); border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(0,255,65,0.2), 0 10px 40px rgba(0,0,0,0.8); display: none; flex-direction: column; min-width: 300px; z-index: 10; }
        .window.active { display: flex; }
        .title-bar { background: #0a0a0a; padding: 8px 12px; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); user-select: none; }
        .title-bar-left { display: flex; align-items: center; gap: 10px; }
        .window-controls { display: flex; gap: 6px; }
        .window-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .btn-close { background: #ff5f57; }
        .btn-minimize { background: #ffbd2e; }
        .btn-maximize { background: #28ca41; }
        .title-bar-title { color: var(--accent); font-size: 11px; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
        .window-content { padding: 30px; flex-grow: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; z-index: 0; }
        .content-overlay { position: relative; z-index: 5; text-align: center; }
        .completed-text { display: flex; justify-content: center; gap: 5px; margin-bottom: 30px; }
        .completed-text span { display: inline-block; font-size: 3em; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.2rem; text-shadow: 0 0 30px rgba(0,255,65,0.8), 0 0 60px rgba(0,255,65,0.6); animation: letterReveal 1s ease-in-out forwards; opacity: 0; }
        @keyframes letterReveal { 0% { opacity: 0; transform: rotateY(90deg) scale(0.5); filter: blur(10px); } 100% { opacity: 1; transform: rotateY(0deg) scale(1); filter: blur(0px); } }
        .completed-text span:nth-child(1) { animation-delay: 0.3s; }
        .completed-text span:nth-child(2) { animation-delay: 0.5s; }
        .completed-text span:nth-child(3) { animation-delay: 0.7s; }
        .completed-text span:nth-child(4) { animation-delay: 0.9s; }
        .completed-text span:nth-child(5) { animation-delay: 1.1s; }
        .completed-text span:nth-child(6) { animation-delay: 1.3s; }
        .completed-text span:nth-child(7) { animation-delay: 1.5s; }
        .completed-text span:nth-child(8) { animation-delay: 1.7s; }
        .completed-text span:nth-child(9) { animation-delay: 1.9s; }
        .moderator-message { background: rgba(0,255,65,0.1); backdrop-filter: blur(10px); border: 2px solid var(--accent); padding: 20px 35px; animation: fadeInUp 0.8s ease-out 2.5s forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .moderator-message h2 { color: var(--accent); font-size: 1.2em; font-weight: 600; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
        .moderator-message h2::before { content: ''; font-size: 1.2em; }
        .moderator-message h2::after { content: ''; font-size: 1.2em; }
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .particle { position: absolute; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: float 3s ease-in-out infinite; box-shadow: 0 0 10px var(--accent); }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; } 50% { transform: translateY(-100px) rotate(180deg); opacity: 1; } }
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 0.5s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 2s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 0.3s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.8s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.3s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1.8s; }
        #taskbar { height: 40px; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-top: 1px solid var(--accent); z-index: 100; }
        #taskbar-left { display: flex; align-items: center; gap: 10px; }
        #start-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; font-size: 11px; font-family: 'Fira Code', monospace; cursor: pointer; }
        #start-btn:hover { background: rgba(0,255,65,0.1); box-shadow: 0 0 10px rgba(0,255,65,0.3); }
        .taskbar-item { background: rgba(0,255,65,0.1); border: 1px solid var(--border-color); color: var(--accent); padding: 5px 12px; font-size: 10px; cursor: pointer; }
        .taskbar-item.active { border-color: var(--accent); background: rgba(0,255,65,0.2); }
        #taskbar-right { display: flex; align-items: center; gap: 15px; }
        #clock { font-size: 11px; color: var(--accent); text-shadow: 0 0 10px rgba(0,255,65,0.5); }
    </style>
</head>
<body>
    <div id="desktop-screen">
        <div id="desktop">
            <div class="icon" onclick="openWindow('complete-window')"><div class="icon-img"></div><div class="icon-label">Mission</div></div>
            <div class="icon"><div class="icon-img"></div><div class="icon-label">Case Files</div></div>
            <div class="icon" onclick="window.location.href='/network/'"><div class="icon-img">📶</div><div class="icon-label">Network</div></div>
            <div class="icon"><div class="icon-img">🔓</div><div class="icon-label">Unlocked</div></div>
        </div>
        <div id="complete-window" class="window active" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 550px; height: 350px;">
            <div class="title-bar" onmousedown="startDrag(event, 'complete-window')">
                <div class="title-bar-left">
                    <div class="window-controls">
                        <div class="window-btn btn-close" onclick="closeWindow('complete-window')"></div>
                        <div class="window-btn btn-minimize"></div>
                        <div class="window-btn btn-maximize"></div>
                    </div>
                    <span class="title-bar-title">mission_status.exe</span>
                </div>
            </div>
            <div class="window-content">
                <video class="video-bg" src="/static/img/smoke.mp4" autoplay muted loop></video>
                <div class="particles">
                    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
                    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
                    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
                </div>
                <div class="content-overlay">
                    <div class="completed-text">
                        <span>C</span><span>O</span><span>M</span><span>P</span><span>L</span><span>E</span><span>T</span><span>E</span><span>D</span>
                    </div>
                    <div class="moderator-message"><h2>Call a Moderator over!</h2></div>
                </div>
            </div>
        </div>
        <div id="taskbar">
            <div id="taskbar-left">
                <div id="start-btn">[ START ]</div>
                <div class="taskbar-item active" onclick="openWindow('complete-window')">mission_status</div>
            </div>
            <div id="taskbar-right"><div id="clock">00:00</div></div>
        </div>
    </div>
    <script>
        function updateClock() { const now = new Date(); document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        setInterval(updateClock, 1000); updateClock();
        let zIndexCounter = 10;
        function openWindow(id) { const win = document.getElementById(id); win.classList.add('active'); bringToFront(win); }
        function closeWindow(id) { document.getElementById(id).classList.remove('active'); }
        function bringToFront(element) { zIndexCounter++; element.style.zIndex = zIndexCounter; }
        let isDragging = false, currentWindow = null, offset = { x: 0, y: 0 };
        function startDrag(e, id) { isDragging = true; currentWindow = document.getElementById(id); bringToFront(currentWindow); const rect = currentWindow.getBoundingClientRect(); offset.x = e.clientX - rect.left; offset.y = e.clientY - rect.top; currentWindow.style.transform = 'none'; currentWindow.style.left = rect.left + 'px'; currentWindow.style.top = rect.top + 'px'; document.addEventListener('mousemove', drag); document.addEventListener('mouseup', stopDrag); }
        function drag(e) { if (!isDragging || !currentWindow) return; e.preventDefault(); currentWindow.style.left = (e.clientX - offset.x) + 'px'; currentWindow.style.top = (e.clientY - offset.y) + 'px'; }
        function stopDrag() { isDragging = false; currentWindow = null; document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', stopDrag); }
    </script>
</body>
</html>
