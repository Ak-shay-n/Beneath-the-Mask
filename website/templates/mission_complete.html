<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Granted - Beneath The Mask</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --window-bg: #0d0d0d;
            --text-color: #00ff41;
            --text-dim: #00aa2a;
            --accent: #00ff41;
            --border-color: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Fira Code', 'Share Tech Mono', monospace; background-color: #000; color: var(--text-color); }
        #desktop-screen { background: url('/static/img/wallpaper.jpg') no-repeat center center/cover; width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        #desktop-screen::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); pointer-events: none; z-index: 1000; }
        #desktop { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 1; }
        .window { position: absolute; background: var(--window-bg); border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(0,255,65,0.2), 0 10px 40px rgba(0,0,0,0.8); display: none; flex-direction: column; min-width: 300px; z-index: 10; }
        .window.active { display: flex; }
        .title-bar { background: #0a0a0a; padding: 0; cursor: move; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); user-select: none; height: 32px; }
        .title-bar-left { display: flex; align-items: center; gap: 10px; padding-left: 12px; }
        .window-controls { display: flex; height: 100%; }
        .window-btn { width: 46px; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #888; font-size: 10px; transition: background 0.15s; }
        .window-btn:hover { background: rgba(255,255,255,0.1); }
        .btn-close:hover { background: #e81123 !important; color: #fff; }
        .title-bar-title { color: var(--accent); font-size: 11px; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
        .window-content { padding: 30px; flex-grow: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Video Background */
        .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; z-index: 0; pointer-events: none; }
        .content-overlay { position: relative; z-index: 5; text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .completed-text { display: flex; justify-content: center; gap: 5px; margin-bottom: 30px; }
        .completed-text span { display: inline-block; font-size: 2.5em; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.15rem; text-shadow: 0 0 30px rgba(0,255,65,0.8), 0 0 60px rgba(0,255,65,0.6); animation: letterReveal 1s ease-in-out forwards; opacity: 0; }
        @keyframes letterReveal { 0% { opacity: 0; transform: rotateY(90deg) scale(0.5); filter: blur(10px); } 100% { opacity: 1; transform: rotateY(0deg) scale(1); filter: blur(0px); } }
        .completed-text span:nth-child(1) { animation-delay: 0.3s; }
        .completed-text span:nth-child(2) { animation-delay: 0.4s; }
        .completed-text span:nth-child(3) { animation-delay: 0.5s; }
        .completed-text span:nth-child(4) { animation-delay: 0.6s; }
        .completed-text span:nth-child(5) { animation-delay: 0.7s; }
        .completed-text span:nth-child(6) { animation-delay: 0.8s; }
        .completed-text span:nth-child(7) { animation-delay: 0.9s; }
        .completed-text span:nth-child(8) { animation-delay: 1.0s; }
        
        .status-box {
            background: rgba(0,255,65,0.1);
            border: 2px solid var(--accent);
            padding: 25px 40px;
            animation: fadeInUp 0.8s ease-out 1.5s forwards;
            opacity: 0;
            text-align: center;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .status-box h2 {
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(0,255,65,0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .status-box p {
            color: var(--text-dim);
            font-size: 11px;
            line-height: 1.8;
            margin: 0;
        }
        
        .home-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            animation: fadeInUp 0.8s ease-out 2s forwards;
            opacity: 0;
        }
        .home-btn:hover {
            background: rgba(0,255,65,0.1);
            box-shadow: 0 0 20px rgba(0,255,65,0.4);
            text-shadow: 0 0 10px rgba(0,255,65,0.8);
        }
        
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .particle { position: absolute; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: float 3s ease-in-out infinite; box-shadow: 0 0 10px var(--accent); }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; } 50% { transform: translateY(-100px) rotate(180deg); opacity: 1; } }
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 0.5s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 2s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 0.3s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 0.8s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 1.3s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1.8s; }
        
        #taskbar { height: 48px; background: rgba(20,20,20,0.98); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-top: 1px solid #333; z-index: 100; }
        #taskbar-left { display: flex; align-items: center; gap: 4px; }
        #start-btn { background: transparent; border: none; color: #fff; padding: 8px 12px; font-size: 14px; cursor: pointer; border-radius: 4px; }
        #start-btn:hover { background: rgba(255,255,255,0.1); }
        .taskbar-item { background: rgba(255,255,255,0.05); border: none; border-bottom: 2px solid var(--accent); color: #fff; padding: 8px 14px; font-size: 11px; cursor: pointer; border-radius: 4px 4px 0 0; }
        .taskbar-item:hover { background: rgba(255,255,255,0.1); }
        #taskbar-right { display: flex; align-items: center; }
        .system-tray { display: flex; align-items: center; padding: 6px 10px; border-radius: 4px; cursor: pointer; gap: 8px; }
        .system-tray:hover { background: rgba(255,255,255,0.1); }
        .tray-icon { font-size: 14px; opacity: 0.9; }
        .tray-divider { width: 1px; height: 24px; background: #444; margin: 0 4px; }
        #clock-section { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        #clock-section:hover { background: rgba(255,255,255,0.1); }
        #clock { font-size: 12px; color: #fff; }
        #date-display { font-size: 11px; color: #bbb; }

        /* JK Surprise Overlay - Intro Style */
        #jk-surprise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            z-index: 3001;
            display: none;
            pointer-events: auto;
        }

        #jk-surprise-overlay.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes popupFromLeft {
            0% { transform: translateX(-100px) scale(0.5); opacity: 0; }
            60% { transform: translateX(10px) scale(1.05); }
            100% { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes slideFromImage {
            from { transform: translate(-100px, 50px) scale(0.3); opacity: 0; }
            to { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        .jk-surprise-container {
            position: fixed;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: flex-end;
            gap: 28px;
            z-index: 3002;
        }

        .jk-surprise-image {
            width: 220px;
            height: 220px;
            background: url('/static/img/jk.png') no-repeat center;
            background-size: contain;
            animation: popupFromLeft 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            flex-shrink: 0;
            border-radius: 16px;
        }

        .jk-surprise-bubble {
            background: linear-gradient(180deg, #ffffff 0%, #e6f2ff 100%);
            border-radius: 16px;
            padding: 18px 22px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid #d0e6ff;
            min-height: 100px;
            max-width: 450px;
        }

        .jk-surprise-bubble.slide-in {
            animation: slideFromImage 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .jk-surprise-bubble::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            width: 24px;
            height: 24px;
            background: #e6f2ff;
            border-radius: 50%;
            border-left: 2px solid #d0e6ff;
            border-top: 2px solid #d0e6ff;
            transform: translateY(-50%);
        }

        .jk-surprise-header {
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }

        .jk-surprise-header h2 {
            margin: 0;
            color: #ff4444;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .jk-surprise-text {
            color: #000;
            font-size: 14px;
            line-height: 1.6;
            min-height: 50px;
            font-family: 'Inter', sans-serif;
        }

        .jk-progress-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }

        .jk-progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            transition: all 0.3s;
        }

        .jk-progress-dot.active { 
            background: #6366f1; 
            transform: scale(1.3);
        }

        .jk-progress-dot.completed { background: #888; }

        .jk-continue-hint {
            color: #888;
            font-size: 12px;
            font-style: italic;
            font-family: 'Inter', sans-serif;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="desktop-screen">
        <div id="desktop"></div>
        
        <div id="complete-window" class="window active" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 550px; height: 400px;">
            <div class="title-bar" onmousedown="startDrag(event, 'complete-window')">
                <div class="title-bar-left">
                    <span class="title-bar-title">access_granted.exe</span>
                </div>
                <div class="window-controls">
                    <div class="window-btn btn-minimize">─</div>
                    <div class="window-btn btn-maximize">☐</div>
                    <div class="window-btn btn-close">✕</div>
                </div>
            </div>
            <div class="window-content">
                <video class="video-bg" src="/static/img/smoke.mp4" autoplay muted loop></video>
                <div class="particles">
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                    <div class="particle"></div>
                </div>
                
                <div class="content-overlay">
                <div class="completed-text">
                    <span>C</span><span>O</span><span>M</span><span>P</span><span>L</span><span>E</span><span>T</span><span>E</span>
                </div>
                
                <div class="status-box">
                    <h2>✓ Investigation Complete</h2>
                    <p>
                        All security protocols bypassed.<br>
                        Target information secured.<br>
                        Mission successful, Agent.
                    </p>
                </div>
                
                <a href="/" class="home-btn">[ Return to Base ]</a>
                </div>
            </div>
        </div>

        <!-- JK Surprise Overlay -->
        <div id="jk-surprise-overlay">
            <div class="jk-surprise-container">
                <div class="jk-surprise-image"></div>
                <div class="jk-surprise-bubble">
                    <div class="jk-surprise-header"><h2>⚠️ Message from JK</h2></div>
                    <div class="jk-surprise-text" id="jk-surprise-text"></div>
                    <div class="jk-progress-dots" id="jk-progress-dots"></div>
                    <div style="margin-top:10px;"><span class="jk-continue-hint">Click or press Space to continue...</span></div>
                </div>
            </div>
        </div>
        
        <div id="taskbar">
            <div id="taskbar-left">
                <div id="start-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
                </div>
                <div class="taskbar-item active">access_granted.exe</div>
            </div>
            <div id="taskbar-right">
                <div class="system-tray">
                    <span class="tray-icon">📶</span>
                    <span class="tray-icon">🔊</span>
                    <span class="tray-icon">🔋</span>
                </div>
                <div class="tray-divider"></div>
                <div id="clock-section">
                    <div id="clock">00:00</div>
                    <div id="date-display">1/1/2026</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Window drag
        let isDragging = false;
        let currentWindow = null;
        let offsetX, offsetY;

        function startDrag(e, windowId) {
            isDragging = true;
            currentWindow = document.getElementById(windowId);
            const rect = currentWindow.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            currentWindow.style.transform = 'none';
            currentWindow.style.left = rect.left + 'px';
            currentWindow.style.top = rect.top + 'px';
        }

        document.addEventListener('mousemove', (e) => {
            if (isDragging && currentWindow) {
                currentWindow.style.left = (e.clientX - offsetX) + 'px';
                currentWindow.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            currentWindow = null;
        });

        // JK Surprise - Intro Style with Click/Space navigation
        const jkMessages = [
            "Well, well, well... You actually made it.",
            "I'm impressed, detective. Not many get this far.",
            "But don't get too comfortable...",
            "This is just the beginning. 😈",
            "See you in 2027! 🎭"
        ];
        let jkMsgIndex = 0;

        function showJKSurprise() {
            const jkOverlay = document.getElementById('jk-surprise-overlay');
            jkOverlay.classList.add('active');
            jkMsgIndex = 0;
            initJKProgressDots();
            showJKMessage();
            
            // Add event listeners
            jkOverlay.addEventListener('click', advanceJKMessage);
            document.addEventListener('keydown', jkKeyHandler);
        }

        function initJKProgressDots() {
            const dotsContainer = document.getElementById('jk-progress-dots');
            dotsContainer.innerHTML = '';
            jkMessages.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'jk-progress-dot';
                dot.id = `jk-dot-${index}`;
                dotsContainer.appendChild(dot);
            });
        }

        function updateJKProgressDots() {
            jkMessages.forEach((_, index) => {
                const dot = document.getElementById(`jk-dot-${index}`);
                if (dot) {
                    if (index < jkMsgIndex) dot.className = 'jk-progress-dot completed';
                    else if (index === jkMsgIndex) dot.className = 'jk-progress-dot active';
                    else dot.className = 'jk-progress-dot';
                }
            });
        }

        function showJKMessage() {
            if (jkMsgIndex >= jkMessages.length) {
                endJKSurprise();
                return;
            }
            updateJKProgressDots();
            const jkText = document.getElementById('jk-surprise-text');
            jkText.innerHTML = jkMessages[jkMsgIndex];
        }

        function advanceJKMessage() {
            jkMsgIndex++;
            showJKMessage();
        }

        function jkKeyHandler(e) {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                advanceJKMessage();
            }
        }

        function endJKSurprise() {
            const jkOverlay = document.getElementById('jk-surprise-overlay');
            jkOverlay.classList.remove('active');
            document.getElementById('jk-surprise-text').innerHTML = '';
            jkOverlay.removeEventListener('click', advanceJKMessage);
            document.removeEventListener('keydown', jkKeyHandler);
        }

        // Trigger JK Surprise after 5 seconds
        setTimeout(() => {
            showJKSurprise();
        }, 5000);
    </script>
</body>
</html>
